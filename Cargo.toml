[workspace]
members = [
    "crates/fluidvoice-app",
    "crates/fluidvoice-audio",
    "crates/fluidvoice-delivery",
    "crates/fluidvoice-portal",
    "crates/fluidvoice-transcription",
    "crates/fluidvoice-ui",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
