[workspace]
members = [
    "crates/spevox-cli",
    "crates/spevox-audio",
    "crates/spevox-delivery",
    "crates/spevox-portal",
    "crates/spevox-transcription",
    "crates/spevox-ui",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
