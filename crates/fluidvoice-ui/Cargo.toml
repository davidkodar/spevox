[package]
name = "fluidvoice-ui"
description = "Qt Quick desktop shell for FluidVoice Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cxx = "1.0.194"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["full"] }
fluidvoice-audio = { path = "../fluidvoice-audio" }
fluidvoice-delivery = { path = "../fluidvoice-delivery" }
fluidvoice-portal = { path = "../fluidvoice-portal" }
fluidvoice-transcription = { path = "../fluidvoice-transcription" }
hound = "3.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.1.4", default-features = false, features = ["rustls"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
cxx-qt-build = { version = "0.9.1", features = ["link_qt_object_files"] }

[lints.rust]
# CXX-Qt bridge declarations require `unsafe extern "C++"`; application Rust
# remains safe and native operations stay behind generated bindings.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
