[package]
name = "fluidvoice-portal"
description = "XDG desktop portal adapters for FluidVoice Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "remote_desktop", "screencast", "tokio"] }
futures-util = "0.3.31"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
