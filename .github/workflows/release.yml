name: Release

on:
  # Releases are temporarily explicit so pushing a tag cannot consume hosted
  # runner minutes unexpectedly. Restore the v* tag trigger when desired.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package and publish
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG")" = "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libpipewire-0.3-dev libvulkan-dev glslc qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools
      - name: Validate dependency licenses
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo about generate about.hbs --workspace --locked --fail --output-file /tmp/THIRD_PARTY_LICENSES.html
          cmp THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
      - name: Build release archive
        run: ./packaging/package-tarball.sh
      - name: Generate Arch recipe
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          git archive --format=tar.gz --prefix="fluidvoice-linux-$version/" -o "target/package/fluidvoice-linux-$version.tar.gz" HEAD
          source_checksum="$(sha256sum "target/package/fluidvoice-linux-$version.tar.gz" | cut -d ' ' -f1)"
          sed -e "s/@VERSION@/$version/g" -e "s/@SOURCE_SHA256@/$source_checksum/g" packaging/arch/PKGBUILD.in > target/package/PKGBUILD
          (cd target/package && sha256sum "fluidvoice-linux-$version.tar.gz" > "fluidvoice-linux-$version.tar.gz.sha256")
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign release artifacts with GitHub OIDC
        shell: bash
        run: |
          for artifact in target/package/*.tar.gz target/package/PKGBUILD; do
            cosign sign-blob --yes "$artifact" --output-signature "$artifact.sig" --output-certificate "$artifact.pem"
          done
      - name: Publish checksummed and signed archive
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: |
            target/package/*.tar.gz
            target/package/*.sha256
            target/package/PKGBUILD
            target/package/*.sig
            target/package/*.pem
