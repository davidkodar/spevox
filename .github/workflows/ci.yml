name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_paths
      - '**.md'
      - 'docs/**'
      - 'data/branding/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore: *docs_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install native dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends build-essential clang cmake libpipewire-0.3-dev libvulkan-dev glslc python3-yaml qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools appstream
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        env:
          QMAKE: /usr/bin/qmake6
        run: dbus-run-session -- cargo test --workspace --locked -- --test-threads=1
      - name: Release build
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo build --release --locked -p spevox-ui
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net data/io.github.davidkodar.Spevox.metainfo.xml
      - name: Validate packaging scripts and manifests
        run: |
          bash -n packaging/*.sh
          python3 -c 'import yaml; yaml.safe_load(open("packaging/flatpak/io.github.davidkodar.Spevox.yml"))'
        env:
          PYTHONWARNINGS: error
