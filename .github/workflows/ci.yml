name: CI

on:
  # Hosted CI is temporarily manual-only while the private-repository minutes
  # allowance is exhausted. Restore push/pull_request triggers when desired.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libpipewire-0.3-dev libvulkan-dev glslc python3-yaml qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        env:
          QMAKE: /usr/bin/qmake6
        run: dbus-run-session -- cargo test --workspace --locked -- --test-threads=1
      - name: Release build
        env:
          QMAKE: /usr/bin/qmake6
        run: cargo build --release --locked -p spevox-ui
      - name: Validate AppStream metadata
        run: sudo apt-get install -y appstream && appstreamcli validate --no-net data/io.github.davidkodar.Spevox.metainfo.xml
      - name: Validate packaging scripts and manifests
        run: |
          bash -n packaging/*.sh
          python3 -c 'import yaml; yaml.safe_load(open("packaging/flatpak/io.github.davidkodar.Spevox.yml"))'
        env:
          PYTHONWARNINGS: error
