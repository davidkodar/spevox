app-id: io.github.davidkodar.Spevox
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: spevox
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --own-name=io.github.davidkodar.Spevox.Profiles
modules:
  - name: spevox
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/spevox/cargo
        QMAKE: /usr/bin/qmake6
    build-commands:
      - cargo build --release --locked --offline -p spevox-ui
      - install -Dm755 target/release/spevox /app/bin/spevox
      - install -Dm644 data/io.github.davidkodar.Spevox.desktop /app/share/applications/io.github.davidkodar.Spevox.desktop
      - install -Dm644 data/io.github.davidkodar.Spevox.metainfo.xml /app/share/metainfo/io.github.davidkodar.Spevox.metainfo.xml
      - install -Dm644 crates/spevox-ui/assets/spevox-app.png /app/share/icons/hicolor/256x256/apps/spevox-app.png
      - install -Dm644 data/icons/hicolor/512x512/apps/io.github.davidkodar.Spevox.png /app/share/icons/hicolor/512x512/apps/spevox-app.png
      - install -Dm644 LICENSE /app/share/licenses/spevox/LICENSE
      - install -Dm644 packaging/kwin-script/metadata.json /app/share/kwin/scripts/spevoxprofiles/metadata.json
      - install -Dm644 packaging/kwin-script/contents/code/main.js /app/share/kwin/scripts/spevoxprofiles/contents/code/main.js
    sources:
      - type: dir
        path: ../../target/flatpak-source
