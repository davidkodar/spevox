app-id: io.github.davidkodar.FluidVoiceLinux
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fluidvoice-ui
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.portal.Desktop
  - --own-name=io.github.davidkodar.FluidVoiceLinux.Profiles
modules:
  - name: fluidvoice-linux
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/fluidvoice-linux/cargo
        QMAKE: /usr/bin/qmake6
    build-commands:
      - cargo build --release --locked --offline -p fluidvoice-ui
      - install -Dm755 target/release/fluidvoice-ui /app/bin/fluidvoice-ui
      - install -Dm644 data/io.github.davidkodar.FluidVoiceLinux.desktop /app/share/applications/io.github.davidkodar.FluidVoiceLinux.desktop
      - install -Dm644 data/io.github.davidkodar.FluidVoiceLinux.metainfo.xml /app/share/metainfo/io.github.davidkodar.FluidVoiceLinux.metainfo.xml
      - install -Dm644 crates/fluidvoice-ui/assets/fluidvoice-app.png /app/share/icons/hicolor/256x256/apps/io.github.davidkodar.FluidVoiceLinux.png
      - install -Dm644 LICENSE /app/share/licenses/fluidvoice-linux/LICENSE
      - install -Dm644 packaging/kwin-script/metadata.json /app/share/kwin/scripts/fluidvoiceprofiles/metadata.json
      - install -Dm644 packaging/kwin-script/contents/code/main.js /app/share/kwin/scripts/fluidvoiceprofiles/contents/code/main.js
    sources:
      - type: dir
        path: ../../target/flatpak-source
